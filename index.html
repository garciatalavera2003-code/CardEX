<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>CEX — Card Detector V0.2.1</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b0b0d;
color:#fff;
font-family:Arial,Helvetica,sans-serif
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px 50px;
text-align:center
}

h1{
margin:10px 0 5px;
font-size:42px;
letter-spacing:3px
}

.subtitle{
color:#888;
margin-bottom:30px
}

.upload{
display:inline-block;
background:#fff;
color:#111;
padding:16px 25px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
font-size:16px
}

.upload input{
display:none
}

#status{
margin:22px 0;
min-height:25px;
font-size:18px
}

.preview{
width:100%;
margin-top:20px
}

#canvas{
display:none;
max-width:100%;
height:auto;
margin:20px auto;
border-radius:10px;
border:1px solid #333
}

.result{
display:none;
margin:25px auto;
padding:20px;
max-width:700px;
background:#161619;
border-radius:12px;
text-align:left;
line-height:1.7
}

.success{
color:#42e878
}

.warning{
color:#ffd166
}

.error{
color:#ff6464
}

.small{
font-size:13px;
color:#888
}
</style>
</head>

<body>

<div class="container">

<h1>CEX</h1>

<div class="subtitle">
CARD DETECTION — V0.2.1
</div>

<label class="upload">

📷 ELEGIR FOTO

<input
type="file"
id="fileInput"
accept="image/*">

</label>

<div id="status">
Cargando motor de visión...
</div>

<div class="preview">

<canvas id="canvas"></canvas>

</div>

<div
id="result"
class="result">
</div>

</div>


<!-- OpenCV se carga UNA SOLA VEZ -->

<script src="https://docs.opencv.org/4.x/opencv.js"></script>


<script>

const input =
document.getElementById("fileInput");

const status =
document.getElementById("status");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const result =
document.getElementById("result");


let cvLoaded = false;
let cvTimer = null;


/*
========================================
ESTADO
========================================
*/

function setStatus(text,cls=""){

status.className = cls;

status.textContent = text;

}


/*
========================================
ESPERAR A OPENCV
========================================
*/

function waitForOpenCV(){

if(typeof cv !== "undefined"){

if(cv.Mat){

cvLoaded = true;

if(cvTimer)
clearInterval(cvTimer);

setStatus(
"Motor de visión listo ✓",
"success"
);

return;

}


if(cv.onRuntimeInitialized === undefined){

cv.onRuntimeInitialized =
function(){

cvLoaded = true;

if(cvTimer)
clearInterval(cvTimer);

setStatus(
"Motor de visión listo ✓",
"success"
);

};

}

}

}


cvTimer =
setInterval(
waitForOpenCV,
100
);

waitForOpenCV();


/*
========================================
TIMEOUT OPENCV
========================================
*/

setTimeout(
function(){

if(!cvLoaded){

setStatus(
"✕ No se pudo cargar el motor de visión. Comprueba la conexión a Internet.",
"error"
);

}

},
15000
);


/*
========================================
SELECCIONAR FOTO
========================================
*/

input.addEventListener(
"change",
function(e){

const file =
e.target.files[0];

if(!file)
return;


result.style.display =
"none";

canvas.style.display =
"none";


if(!file.type.startsWith("image/")){

setStatus(
"✕ El archivo seleccionado no es una imagen.",
"error"
);

return;

}


setStatus(
"Foto recibida ✓",
"success"
);


const reader =
new FileReader();


reader.onload =
function(){

const img =
new Image();


img.onload =
function(){

canvas.style.display =
"block";


if(!cvLoaded){

setStatus(
"Foto cargada. Esperando motor de visión...",
"warning"
);


const start =
Date.now();


const wait =
setInterval(
function(){

if(cvLoaded){

clearInterval(wait);

detectCard(img);

}

else if(
Date.now()-start > 15000
){

clearInterval(wait);

setStatus(
"✕ El motor de visión no ha terminado de cargar.",
"error"
);

}

},
100
);

}

else{

detectCard(img);

}

};


img.onerror =
function(){

setStatus(
"✕ El navegador no pudo interpretar la fotografía.",
"error"
);

};


img.src =
reader.result;

};


reader.onerror =
function(){

setStatus(
"✕ No se pudo leer la fotografía.",
"error"
);

};


reader.readAsDataURL(file);

}
);


/*
========================================
DETECTAR CARTA
========================================
*/

function detectCard(img){

setStatus(
"Buscando carta..."
);


const MAX = 1400;


const scale =
Math.min(
1,
MAX / img.naturalWidth
);


const w =
Math.round(
img.naturalWidth * scale
);


const h =
Math.round(
img.naturalHeight * scale
);


canvas.width = w;
canvas.height = h;


ctx.drawImage(
img,
0,
0,
w,
h
);


let src = null;
let gray = null;
let blur = null;
let edges = null;
let contours = null;
let hierarchy = null;
let best = null;


try{

/*
========================================
IMAGEN
========================================
*/

src =
cv.imread(canvas);


/*
========================================
GRISES
========================================
*/

gray =
new cv.Mat();


cv.cvtColor(
src,
gray,
cv.COLOR_RGBA2GRAY
);


/*
========================================
REDUCIR RUIDO
========================================
*/

blur =
new cv.Mat();


cv.GaussianBlur(
gray,
blur,
new cv.Size(5,5),
0
);


/*
========================================
DETECTAR BORDES
========================================
*/

edges =
new cv.Mat();


cv.Canny(
blur,
edges,
40,
120
);


/*
========================================
BUSCAR CONTORNOS
========================================
*/

contours =
new cv.MatVector();


hierarchy =
new cv.Mat();


cv.findContours(
edges,
contours,
hierarchy,
cv.RETR_LIST,
cv.CHAIN_APPROX_SIMPLE
);


let bestScore = 0;
let bestData = null;


/*
========================================
BUSCAR POSIBLE CARTA
========================================
*/

for(
let i=0;
i<contours.size();
i++
){

const contour =
contours.get(i);


const area =
Math.abs(
cv.contourArea(contour)
);


/*
Ignorar objetos pequeños
*/

if(
area < 0.05*w*h
){

contour.delete();

continue;

}


const perimeter =
cv.arcLength(
contour,
true
);


const approx =
new cv.Mat();


cv.approxPolyDP(
contour,
approx,
0.02*perimeter,
true
);


/*
Una carta debe tener
aproximadamente 4 esquinas
*/

if(
approx.rows === 4
){

const rect =
cv.boundingRect(
approx
);


const ratio =
Math.min(
rect.width,
rect.height
)
/
Math.max(
rect.width,
rect.height
);


/*
Carta estándar:

63 × 88 mm

ratio ≈ 0.716
*/

if(
ratio >= 0.62 &&
ratio <= 0.82
){

const imageArea =
w*h;


const areaRatio =
area/imageArea;


if(
areaRatio >= 0.05
){

const ratioError =
Math.abs(
ratio-0.716
);


const ratioScore =
Math.max(
0,
1-ratioError/0.104
);


const areaScore =
Math.min(
1,
areaRatio/0.60
);


const score =
ratioScore*0.60+
areaScore*0.40;


if(
score > bestScore
){

if(best)
best.delete();


best =
approx;


bestScore =
score;


bestData = {

rect:rect,

ratio:ratio,

areaRatio:areaRatio

};

}

else{

approx.delete();

}

}

else{

approx.delete();

}

}

else{

approx.delete();

}

}

else{

approx.delete();

}


contour.delete();

}


/*
========================================
CARTA ENCONTRADA
========================================
*/

if(
best &&
bestScore >= 0.55
){

const output =
src.clone();


const vector =
new cv.MatVector();


vector.push_back(
best
);


/*
Dibujar bordes
*/

cv.drawContours(
output,
vector,
-1,
new cv.Scalar(
0,
255,
0,
255
),
Math.max(
5,
Math.round(w/250)
)
);


cv.imshow(
canvas,
output
);


const confidence =
Math.min(
99,
Math.max(
55,
bestScore*100
)
);


setStatus(
"✓ CARTA DETECTADA",
"success"
);


result.style.display =
"block";


result.innerHTML =

"<strong>Objeto detectado: CARTA ✓</strong><br><br>"+

"Confianza geométrica: <strong>"+
confidence.toFixed(1)+
"%</strong><br><br>"+

"<strong>Bordes detectados</strong><br>"+

"4 esquinas ✓<br>"+

"Ancho: "+
bestData.rect.width+
" px<br>"+

"Alto: "+
bestData.rect.height+
" px<br>"+

"Proporción: "+
bestData.ratio.toFixed(3)+
"<br><br>"+

'<span class="small">'+

"La detección utiliza únicamente "+
"bordes, geometría y proporción. "+
"No se analiza todavía el contenido "+
"de la carta."

+
"</span>";


output.delete();

vector.delete();

}


/*
========================================
NO HAY CARTA
========================================
*/

else{

setStatus(
"⚠️ NO SE HA DETECTADO UNA CARTA",
"warning"
);


result.style.display =
"block";


result.innerHTML =

"<strong>Análisis detenido</strong><br><br>"+

"No se encontró un objeto con geometría "+
"suficientemente compatible con una carta."+

"<br><br>"+

"✓ La imagen NO se analizará como carta."+

"<br><br>"+

'<span class="small">'+

"Prueba con la carta completamente visible, "+
"sin objetos encima y sobre un fondo que contraste."

+
"</span>";

}

}


/*
========================================
ERROR
========================================
*/

catch(error){

console.error(error);


setStatus(
"✕ Error durante la detección",
"error"
);


result.style.display =
"block";


result.innerHTML =

"Error técnico:<br><br>"+

"<code>"+

escapeHtml(
error.message ||
String(error)
)+

"</code>";

}


/*
========================================
LIBERAR MEMORIA
========================================
*/

finally{

if(src)
src.delete();

if(gray)
gray.delete();

if(blur)
blur.delete();

if(edges)
edges.delete();

if(contours)
contours.delete();

if(hierarchy)
hierarchy.delete();

if(best)
best.delete();

}

}


/*
========================================
ESCAPAR HTML
========================================
*/

function escapeHtml(str){

return String(str)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}

</script>

</body>
</html>
