<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>CEX — Card Detector V0.2.3</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#0b0b0d;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px 50px;
text-align:center;
}

h1{
margin:10px 0 5px;
font-size:42px;
letter-spacing:3px;
}

.subtitle{
color:#888;
margin-bottom:30px;
}

.version{
font-size:12px;
color:#555;
margin-top:-20px;
margin-bottom:30px;
}

.upload{
display:inline-block;
background:#fff;
color:#111;
padding:16px 25px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
font-size:16px;
}

.upload input{
display:none;
}

#status{
margin:22px 0;
min-height:25px;
font-size:18px;
}

.preview{
width:100%;
margin-top:20px;
}

#canvas{
display:none;
max-width:100%;
height:auto;
margin:20px auto;
border-radius:10px;
border:1px solid #333;
}

.result{
display:none;
margin:25px auto;
padding:20px;
max-width:700px;
background:#161619;
border-radius:12px;
text-align:left;
line-height:1.7;
}

.success{
color:#42e878;
}

.warning{
color:#ffd166;
}

.error{
color:#ff6464;
}

.small{
font-size:13px;
color:#888;
}

</style>

</head>


<body>


<div class="container">


<h1>CEX</h1>


<div class="subtitle">
CARD DETECTION — V0.2.3
</div>


<div class="version">
SYSTEM VERSION 0.2.3
</div>


<label class="upload">

📷 ELEGIR FOTO

<input
type="file"
id="fileInput"
accept="image/*">

</label>


<div id="status">
Cargando motor de visión...
</div>


<div class="preview">

<canvas id="canvas"></canvas>

</div>


<div
id="result"
class="result">
</div>


</div>



<!-- ==================================================
     OPENCV
================================================== -->

<script src="https://docs.opencv.org/4.x/opencv.js"></script>



<script>

/* ==================================================
   CONFIGURACIÓN
================================================== */

const VERSION = "0.2.3";

const input =
document.getElementById("fileInput");

const status =
document.getElementById("status");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const result =
document.getElementById("result");


let cvLoaded = false;

let cvTimer = null;


/* ==================================================
   ESTADO
================================================== */

function setStatus(text, className = "") {

    status.className = className;

    status.textContent = text;

}


/* ==================================================
   COMPROBAR OPENCV
================================================== */

function checkOpenCV() {

    try {

        if (
            typeof cv !== "undefined" &&
            typeof cv.Mat !== "undefined"
        ) {

            cvLoaded = true;

            if (cvTimer) {

                clearInterval(cvTimer);

                cvTimer = null;

            }

            setStatus(
                "Motor de visión listo ✓",
                "success"
            );

            return true;

        }

    } catch (error) {

        console.log(error);

    }

    return false;

}


/* ==================================================
   ESPERAR OPENCV
================================================== */

cvTimer =
setInterval(
    checkOpenCV,
    100
);

checkOpenCV();


setTimeout(
    function(){

        if (!cvLoaded) {

            setStatus(
                "✕ No se pudo cargar el motor de visión.",
                "error"
            );

            result.style.display =
                "block";

            result.innerHTML =
                "<strong>Error del motor</strong><br><br>" +
                "OpenCV no se ha cargado correctamente.<br><br>" +
                "Comprueba que GitHub Pages tiene conexión a Internet.";

        }

    },
    15000
);



/* ==================================================
   SELECCIONAR FOTO
================================================== */

input.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        result.style.display =
            "none";


        canvas.style.display =
            "none";


        if (
            !file.type.startsWith("image/")
        ) {

            setStatus(
                "✕ El archivo no es una imagen.",
                "error"
            );

            return;

        }


        setStatus(
            "Foto recibida ✓",
            "success"
        );


        const reader =
            new FileReader();


        reader.onload =
            function(){

                const img =
                    new Image();


                img.onload =
                    function(){

                        canvas.style.display =
                            "block";


                        if (!cvLoaded) {

                            setStatus(
                                "Foto cargada. Esperando motor de visión...",
                                "warning"
                            );


                            const start =
                                Date.now();


                            const wait =
                                setInterval(
                                    function(){

                                        if (cvLoaded) {

                                            clearInterval(wait);

                                            detectCard(img);

                                        }


                                        else if (
                                            Date.now() - start > 15000
                                        ) {

                                            clearInterval(wait);

                                            setStatus(
                                                "✕ El motor de visión no ha cargado.",
                                                "error"
                                            );

                                        }

                                    },
                                    100
                                );


                        }

                        else {

                            detectCard(img);

                        }

                    };


                img.onerror =
                    function(){

                        setStatus(
                            "✕ No se pudo interpretar la fotografía.",
                            "error"
                        );

                    };


                img.src =
                    reader.result;

            };


        reader.onerror =
            function(){

                setStatus(
                    "✕ No se pudo leer la fotografía.",
                    "error"
                );

            };


        reader.readAsDataURL(file);

    }
);



/* ==================================================
   DETECTAR CARTA
================================================== */

function detectCard(img) {

    setStatus(
        "Buscando los bordes de la carta..."
    );


    const MAX_WIDTH = 1400;


    const scale =
        Math.min(
            1,
            MAX_WIDTH / img.naturalWidth
        );


    const width =
        Math.round(
            img.naturalWidth * scale
        );


    const height =
        Math.round(
            img.naturalHeight * scale
        );


    canvas.width =
        width;


    canvas.height =
        height;


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    let src = null;
    let gray = null;
    let blur = null;
    let edges = null;
    let morph = null;
    let contours = null;
    let hierarchy = null;
    let best = null;


    try {


        /* ==================================================
           IMAGEN
        ================================================== */

        src =
            cv.imread(canvas);



        /* ==================================================
           GRIS
        ================================================== */

        gray =
            new cv.Mat();


        cv.cvtColor(
            src,
            gray,
            cv.COLOR_RGBA2GRAY
        );



        /* ==================================================
           REDUCIR RUIDO
        ================================================== */

        blur =
            new cv.Mat();


        cv.GaussianBlur(
            gray,
            blur,
            new cv.Size(5,5),
            0
        );



        /* ==================================================
           BORDES
        ================================================== */

        edges =
            new cv.Mat();


        cv.Canny(
            blur,
            edges,
            30,
            100
        );



        /* ==================================================
           CERRAR HUECOS
        ================================================== */

        morph =
            new cv.Mat();


        const kernel =
            cv.Mat.ones(
                5,
                5,
                cv.CV_8U
            );


        cv.morphologyEx(
            edges,
            morph,
            cv.MORPH_CLOSE,
            kernel
        );


        kernel.delete();



        /* ==================================================
           CONTORNOS
        ================================================== */

        contours =
            new cv.MatVector();


        hierarchy =
            new cv.Mat();


        cv.findContours(
            morph,
            contours,
            hierarchy,
            cv.RETR_LIST,
            cv.CHAIN_APPROX_SIMPLE
        );



        let bestScore =
            0;


        let bestData =
            null;



        /* ==================================================
           ANALIZAR CONTORNOS
        ================================================== */

        for (
            let i = 0;
            i < contours.size();
            i++
        ) {


            const contour =
                contours.get(i);


            const area =
                Math.abs(
                    cv.contourArea(
                        contour
                    )
                );


            /*
            Ignorar objetos demasiado pequeños.
            */

            if (
                area <
                0.01 *
                width *
                height
            ) {

                contour.delete();

                continue;

            }



            const perimeter =
                cv.arcLength(
                    contour,
                    true
                );


            const approx =
                new cv.Mat();


            cv.approxPolyDP(
                contour,
                approx,
                0.025 * perimeter,
                true
            );



            /*
            Buscamos cuatro esquinas.
            */

            if (
                approx.rows === 4
            ) {


                const points =
                    getPoints(
                        approx
                    );


                if (
                    points.length === 4
                ) {


                    const ordered =
                        orderPoints(
                            points
                        );



                    /* ==================================================
                       LONGITUDES
                    ================================================== */

                    const top =
                        distance(
                            ordered[0],
                            ordered[1]
                        );


                    const right =
                        distance(
                            ordered[1],
                            ordered[2]
                        );


                    const bottom =
                        distance(
                            ordered[2],
                            ordered[3]
                        );


                    const left =
                        distance(
                            ordered[3],
                            ordered[0]
                        );



                    const avgWidth =
                        (
                            top +
                            bottom
                        ) / 2;


                    const avgHeight =
                        (
                            left +
                            right
                        ) / 2;



                    if (
                        avgWidth > 0 &&
                        avgHeight > 0
                    ) {


                        const ratio =
                            Math.min(
                                avgWidth,
                                avgHeight
                            )
                            /
                            Math.max(
                                avgWidth,
                                avgHeight
                            );



                        /*
                        Permitimos bastante perspectiva.
                        */

                        if (
                            ratio >= 0.50 &&
                            ratio <= 0.90
                        ) {


                            const widthConsistency =
                                1 -
                                Math.abs(
                                    top - bottom
                                )
                                /
                                Math.max(
                                    top,
                                    bottom
                                );


                            const heightConsistency =
                                1 -
                                Math.abs(
                                    left - right
                                )
                                /
                                Math.max(
                                    left,
                                    right
                                );



                            const areaRatio =
                                area /
                                (
                                    width *
                                    height
                                );



                            /*
                            Ratio ideal de una
                            carta Pokémon estándar.
                            */

                            const ratioError =
                                Math.abs(
                                    ratio - 0.716
                                );


                            const ratioScore =
                                Math.max(
                                    0,
                                    1 -
                                    ratioError /
                                    0.216
                                );



                            /*
                            Tamaño.
                            */

                            const areaScore =
                                Math.min(
                                    1,
                                    areaRatio / 0.30
                                );



                            /*
                            Score final.
                            */

                            const score =

                                ratioScore *
                                0.35

                                +

                                widthConsistency *
                                0.25

                                +

                                heightConsistency *
                                0.25

                                +

                                areaScore *
                                0.15;



                            if (
                                score >
                                bestScore
                            ) {


                                if (best) {

                                    best.delete();

                                }


                                best =
                                    approx;


                                bestScore =
                                    score;


                                bestData = {

                                    points:
                                        ordered,

                                    ratio:
                                        ratio,

                                    width:
                                        avgWidth,

                                    height:
                                        avgHeight,

                                    areaRatio:
                                        areaRatio

                                };


                            }

                            else {

                                approx.delete();

                            }


                        }

                        else {

                            approx.delete();

                        }

                    }

                    else {

                        approx.delete();

                    }

                }

                else {

                    approx.delete();

                }

            }

            else {

                approx.delete();

            }


            contour.delete();

        }



        /* ==================================================
           RESULTADO
        ================================================== */

        if (
            best &&
            bestScore >= 0.50
        ) {


            const output =
                src.clone();


            const vector =
                new cv.MatVector();


            vector.push_back(
                best
            );



            /*
            Dibujar los cuatro bordes.
            */

            cv.drawContours(
                output,
                vector,
                -1,
                new cv.Scalar(
                    0,
                    255,
                    0,
                    255
                ),
                Math.max(
                    5,
                    Math.round(
                        width / 220
                    )
                )
            );



            /*
            Dibujar las cuatro esquinas.
            */

            for (
                const point
                of bestData.points
            ) {


                cv.circle(
                    output,
                    new cv.Point(
                        Math.round(point.x),
                        Math.round(point.y)
                    ),
                    Math.max(
                        7,
                        Math.round(
                            width / 90
                        )
                    ),
                    new cv.Scalar(
                        255,
                        255,
                        255,
                        255
                    ),
                    -1
                );

            }



            /*
            Mostrar resultado.
            */

            cv.imshow(
                canvas,
                output
            );



            const confidence =
                Math.min(
                    99.9,
                    Math.max(
                        50,
                        bestScore * 100
                    )
                );



            setStatus(
                "✓ CARTA DETECTADA",
                "success"
            );



            result.style.display =
                "block";


            result.innerHTML =

                "<strong>✓ CARTA DETECTADA</strong><br><br>" +

                "<strong>Versión del sistema:</strong> V" +
                VERSION +
                "<br><br>" +

                "<strong>Confianza geométrica:</strong> " +
                confidence.toFixed(1) +
                "%<br><br>" +

                "<strong>4 esquinas detectadas ✓</strong><br><br>" +

                "Ancho aproximado: " +
                Math.round(
                    bestData.width
                ) +
                " px<br>" +

                "Alto aproximado: " +
                Math.round(
                    bestData.height
                ) +
                " px<br>" +

                "Proporción: " +
                bestData.ratio.toFixed(3) +
                "<br><br>" +

                '<span class="small">' +

                "Esta versión únicamente determina "+
                "si existe una forma compatible con "+
                "una carta y delimita sus bordes. "+
                "Todavía no identifica Pokémon, "+
                "colección, idioma ni defectos."

                +

                "</span>";



            output.delete();

            vector.delete();


            /*
            NO borramos best aquí.
            Se borra una sola vez en finally.
            */


        }

        else {


            setStatus(
                "⚠️ NO SE HA DETECTADO UNA CARTA",
                "warning"
            );


            result.style.display =
                "block";


            result.innerHTML =

                "<strong>ANÁLISIS DETENIDO</strong><br><br>" +

                "No se ha encontrado una forma "+
                "suficientemente compatible con "+
                "una carta.<br><br>" +

                "✓ La imagen NO se analizará como carta.<br><br>" +

                '<span class="small">' +

                "El sistema necesita detectar "+
                "primero los cuatro bordes antes "+
                "de continuar con cualquier análisis."

                +

                "</span>";

        }


    }


    catch (
        error
    ) {


        console.error(
            error
        );


        setStatus(
            "✕ Error durante la detección",
            "error"
        );


        result.style.display =
            "block";


        result.innerHTML =

            "<strong>Error técnico</strong><br><br>" +

            "<code>" +

            escapeHtml(
                error.message ||
                String(error)
            ) +

            "</code>";

    }


    finally {


        /*
        Liberamos memoria.
        */

        if (src)
            src.delete();


        if (gray)
            gray.delete();


        if (blur)
            blur.delete();


        if (edges)
            edges.delete();


        if (morph)
            morph.delete();


        if (contours)
            contours.delete();


        if (hierarchy)
            hierarchy.delete();


        if (best)
            best.delete();

    }

}



/* ==================================================
   OBTENER PUNTOS
================================================== */

function getPoints(mat) {

    const points = [];


    for (
        let i = 0;
        i < mat.rows;
        i++
    ) {

        points.push({

            x:
                mat.data32S[
                    i * 2
                ],

            y:
                mat.data32S[
                    i * 2 + 1
                ]

        });

    }


    return points;

}



/* ==================================================
   ORDENAR ESQUINAS
================================================== */

function orderPoints(points) {

    if (
        points.length !== 4
    ) {

        return points;

    }


    const sums =
        points.map(
            p =>
                p.x +
                p.y
        );


    const diffs =
        points.map(
            p =>
                p.x -
                p.y
        );


    const tl =
        points[
            sums.indexOf(
                Math.min(
                    ...sums
                )
            )
        ];


    const br =
        points[
            sums.indexOf(
                Math.max(
                    ...sums
                )
            )
        ];


    const tr =
        points[
            diffs.indexOf(
                Math.max(
                    ...diffs
                )
            )
        ];


    const bl =
        points[
            diffs.indexOf(
                Math.min(
                    ...diffs
                )
            )
        ];


    return [
        tl,
        tr,
        br,
        bl
    ];

}



/* ==================================================
   DISTANCIA
================================================== */

function distance(
    a,
    b
) {

    return Math.sqrt(

        Math.pow(
            b.x - a.x,
            2
        )

        +

        Math.pow(
            b.y - a.y,
            2
        )

    );

}



/* ==================================================
   ESCAPAR HTML
================================================== */

function escapeHtml(str) {

    return String(str)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

</script>

</body>

</html>
