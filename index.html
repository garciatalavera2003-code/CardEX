<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">

<title>CEX — Card Detector V0.2.2</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#0b0b0d;

color:#fff;

font-family:
Arial,
Helvetica,
sans-serif;

}


.container{

max-width:1000px;

margin:auto;

padding:
30px
20px
50px;

text-align:center;

}


h1{

margin:
10px
0
5px;

font-size:42px;

letter-spacing:3px;

}


.subtitle{

color:#888;

margin-bottom:30px;

}


.upload{

display:inline-block;

background:#fff;

color:#111;

padding:
16px
25px;

border-radius:10px;

font-weight:bold;

cursor:pointer;

font-size:16px;

}


.upload input{

display:none;

}


#status{

margin:
22px
0;

min-height:25px;

font-size:18px;

}


.preview{

width:100%;

margin-top:20px;

}


#canvas{

display:none;

max-width:100%;

height:auto;

margin:
20px
auto;

border-radius:10px;

border:1px solid #333;

}


.result{

display:none;

margin:
25px
auto;

padding:20px;

max-width:700px;

background:#161619;

border-radius:12px;

text-align:left;

line-height:1.7;

}


.success{

color:#42e878;

}


.warning{

color:#ffd166;

}


.error{

color:#ff6464;

}


.small{

font-size:13px;

color:#888;

}

</style>

</head>


<body>


<div class="container">


<h1>CEX</h1>


<div class="subtitle">

CARD DETECTION — V0.2.2

</div>


<label class="upload">

📷 ELEGIR FOTO

<input
type="file"
id="fileInput"
accept="image/*">

</label>


<div id="status">

Cargando motor de visión...

</div>


<div class="preview">

<canvas id="canvas"></canvas>

</div>


<div
id="result"
class="result">

</div>


</div>



<!-- =====================================
     OPENCV
===================================== -->

<script src="https://docs.opencv.org/4.x/opencv.js"></script>



<script>


const input =
document.getElementById(
"fileInput"
);


const status =
document.getElementById(
"status"
);


const canvas =
document.getElementById(
"canvas"
);


const ctx =
canvas.getContext(
"2d"
);


const result =
document.getElementById(
"result"
);



let cvLoaded = false;

let cvTimer = null;



/* =====================================
   ESTADO
===================================== */


function setStatus(
text,
className=""
){

status.className =
className;

status.textContent =
text;

}



/* =====================================
   ESPERAR OPENCV
===================================== */


function waitForOpenCV(){

if(
typeof cv !== "undefined"
){

if(
cv.Mat
){

cvLoaded = true;

if(cvTimer)
clearInterval(
cvTimer
);

setStatus(
"Motor de visión listo ✓",
"success"
);

return;

}


if(
cv.onRuntimeInitialized === undefined
){

cv.onRuntimeInitialized =
function(){

cvLoaded = true;

if(cvTimer)
clearInterval(
cvTimer
);

setStatus(
"Motor de visión listo ✓",
"success"
);

};

}

}

}


cvTimer =
setInterval(
waitForOpenCV,
100
);


waitForOpenCV();



/* =====================================
   TIMEOUT
===================================== */


setTimeout(
function(){

if(!cvLoaded){

setStatus(
"✕ No se pudo cargar el motor de visión.",
"error"
);

}

},
15000
);



/* =====================================
   CARGAR FOTO
===================================== */


input.addEventListener(
"change",
function(e){

const file =
e.target.files[0];


if(!file)
return;


result.style.display =
"none";


canvas.style.display =
"none";


if(
!file.type.startsWith(
"image/"
)
){

setStatus(
"✕ El archivo no es una imagen.",
"error"
);

return;

}


setStatus(
"Foto recibida ✓",
"success"
);


const reader =
new FileReader();


reader.onload =
function(){

const img =
new Image();


img.onload =
function(){

canvas.style.display =
"block";


if(!cvLoaded){

setStatus(
"Esperando motor de visión...",
"warning"
);


const start =
Date.now();


const wait =
setInterval(
function(){

if(cvLoaded){

clearInterval(
wait
);

detectCard(img);

}

else if(
Date.now() -
start >
15000
){

clearInterval(
wait
);

setStatus(
"✕ El motor de visión no ha cargado.",
"error"
);

}

},
100
);

}

else{

detectCard(img);

}

};


img.onerror =
function(){

setStatus(
"✕ No se pudo interpretar la fotografía.",
"error"
);

};


img.src =
reader.result;

};


reader.onerror =
function(){

setStatus(
"✕ No se pudo leer la fotografía.",
"error"
);

};


reader.readAsDataURL(
file
);

}

);



/* =====================================
   DETECCIÓN DE CARTA
===================================== */


function detectCard(img){

setStatus(
"Buscando los bordes de la carta..."
);


const MAX_WIDTH =
1400;


const scale =
Math.min(
1,
MAX_WIDTH /
img.naturalWidth
);


const width =
Math.round(
img.naturalWidth *
scale
);


const height =
Math.round(
img.naturalHeight *
scale
);


canvas.width =
width;


canvas.height =
height;


ctx.drawImage(
img,
0,
0,
width,
height
);



let src = null;

let gray = null;

let blur = null;

let edges = null;

let morph = null;

let contours = null;

let hierarchy = null;

let best = null;



try{


/* =====================================
   IMAGEN ORIGINAL
===================================== */


src =
cv.imread(
canvas
);



/* =====================================
   ESCALA DE GRISES
===================================== */


gray =
new cv.Mat();


cv.cvtColor(
src,
gray,
cv.COLOR_RGBA2GRAY
);



/* =====================================
   REDUCIR RUIDO
===================================== */


blur =
new cv.Mat();


cv.GaussianBlur(
gray,
blur,
new cv.Size(
5,
5
),
0
);



/* =====================================
   DETECTAR BORDES
===================================== */


edges =
new cv.Mat();


cv.Canny(
blur,
edges,
30,
100
);



/* =====================================
   CERRAR PEQUEÑOS HUECOS
===================================== */


morph =
new cv.Mat();


const kernel =
cv.Mat.ones(
5,
5,
cv.CV_8U
);


cv.morphologyEx(
edges,
morph,
cv.MORPH_CLOSE,
kernel
);


kernel.delete();



/* =====================================
   CONTORNOS
===================================== */


contours =
new cv.MatVector();


hierarchy =
new cv.Mat();


cv.findContours(
morph,
contours,
hierarchy,
cv.RETR_LIST,
cv.CHAIN_APPROX_SIMPLE
);



let bestScore =
0;


let bestData =
null;



/* =====================================
   ANALIZAR CONTORNOS
===================================== */


for(
let i = 0;
i < contours.size();
i++
){


const contour =
contours.get(i);


const area =
Math.abs(
cv.contourArea(
contour
)
);



/*
La carta debe ocupar
una parte razonable
de la fotografía.
*/


if(
area <
0.015 *
width *
height
){

contour.delete();

continue;

}



const perimeter =
cv.arcLength(
contour,
true
);



const approx =
new cv.Mat();



/*
Un epsilon ligeramente
mayor permite encontrar
las esquinas aunque haya
ruido en los bordes.
*/


cv.approxPolyDP(
contour,
approx,
0.025 *
perimeter,
true
);



/*
Buscamos exactamente
4 esquinas.
*/


if(
approx.rows === 4
){


const points =
getPoints(
approx
);



if(
points.length === 4
){


const ordered =
orderPoints(
points
);



/*
---------------------------------------
LONGITUDES DE LOS 4 LADOS
---------------------------------------
*/


const top =
distance(
ordered[0],
ordered[1]
);


const right =
distance(
ordered[1],
ordered[2]
);


const bottom =
distance(
ordered[2],
ordered[3]
);


const left =
distance(
ordered[3],
ordered[0]
);



/*
---------------------------------------
ANCHOS Y ALTOS MEDIOS
---------------------------------------
*/


const avgWidth =
(
top +
bottom
) / 2;


const avgHeight =
(
left +
right
) / 2;



if(
avgWidth > 0 &&
avgHeight > 0
){


const ratio =
Math.min(
avgWidth,
avgHeight
)
/
Math.max(
avgWidth,
avgHeight
);



/*
---------------------------------------
RATIO
---------------------------------------

Carta Pokémon:

63 / 88 ≈ 0.716

Pero permitimos bastante
perspectiva.
*/


if(
ratio >= 0.52 &&
ratio <= 0.86
){


/*
---------------------------------------
SIMETRÍA DE LADOS
---------------------------------------
*/


const widthConsistency =
1 -
Math.abs(
top -
bottom
) /
Math.max(
top,
bottom
);


const heightConsistency =
1 -
Math.abs(
left -
right
) /
Math.max(
left,
right
);



/*
---------------------------------------
ÁREA
---------------------------------------
*/


const areaRatio =
area /
(
width *
height
);



/*
---------------------------------------
RECTANGULARIDAD
---------------------------------------
*/


const rectangleArea =
avgWidth *
avgHeight;


const rectangularity =
Math.min(
1,
area /
rectangleArea
);



/*
---------------------------------------
RATIO SCORE
---------------------------------------
*/


const ratioError =
Math.abs(
ratio -
0.716
);


const ratioScore =
Math.max(
0,
1 -
ratioError /
0.196
);



/*
---------------------------------------
ÁREA SCORE
---------------------------------------
*/


const areaScore =
Math.min(
1,
areaRatio /
0.25
);



/*
---------------------------------------
SCORE FINAL
---------------------------------------
*/


const score =

ratioScore *
0.35

+

widthConsistency *
0.20

+

heightConsistency *
0.20

+

rectangularity *
0.15

+

areaScore *
0.10;



/*
---------------------------------------
MEJOR CANDIDATO
---------------------------------------
*/


if(
score >
bestScore
){


if(best)
best.delete();


best =
approx;


bestScore =
score;


bestData = {

points:
ordered,

ratio:
ratio,

area:
area,

areaRatio:
areaRatio,

width:
avgWidth,

height:
avgHeight,

widthConsistency:
widthConsistency,

heightConsistency:
heightConsistency

};


}

else{

approx.delete();

}


}

}

}

}

else{

approx.delete();

}


contour.delete();

}



/* =====================================
   VALIDAR CARTA
===================================== */


if(
best &&
bestScore >= 0.55
){


/*
========================================
DIBUJAR RESULTADO
========================================
*/


const output =
src.clone();


const vector =
new cv.MatVector();


vector.push_back(
best
);



/*
Bordes verdes
*/


cv.drawContours(
output,
vector,
-1,
new cv.Scalar(
0,
255,
0,
255
),
Math.max(
5,
Math.round(
width /
220
)
)
);



/*
========================================
DIBUJAR 4 ESQUINAS
========================================
*/


for(
const p of bestData.points
){

cv.circle(
output,
new cv.Point(
Math.round(p.x),
Math.round(p.y)
),
Math.max(
7,
Math.round(
width /
90
)
),
new cv.Scalar(
255,
255,
255,
255
),
-1
);

}



/*
========================================
MOSTRAR
========================================
*/


cv.imshow(
canvas,
output
);



const confidence =
Math.min(
99.9,
Math.max(
55,
bestScore *
100
)
);



setStatus(
"✓ CARTA DETECTADA",
"success"
);



result.style.display =
"block";


result.innerHTML =

"<strong>✓ OBJETO IDENTIFICADO COMO CARTA</strong><br><br>"+

"<strong>Confianza:</strong> "+
confidence.toFixed(1)+
"%<br><br>"+

"<strong>4 esquinas detectadas ✓</strong><br><br>"+

"Ancho aproximado: "+
Math.round(
bestData.width
)+
" px<br>"+

"Alto aproximado: "+
Math.round(
bestData.height
)+
" px<br>"+

"Proporción: "+
bestData.ratio.toFixed(
3
)+
"<br><br>"+

'<span class="small">'+

"El sistema ha validado la geometría "+
"de la carta antes de continuar. "+
"No se ha analizado todavía el contenido, "+
"el Pokémon, el idioma ni la colección."

+
"</span>";



output.delete();

vector.delete();


}

else{


/*
========================================
NO ES UNA CARTA
========================================
*/


setStatus(
"⚠️ NO SE HA DETECTADO UNA CARTA",
"warning"
);


result.style.display =
"block";


result.innerHTML =

"<strong>Análisis detenido</strong><br><br>"+

"No se ha encontrado una forma rectangular "+
"compatible con una carta.<br><br>"+

"✓ La imagen NO se analizará como carta.<br><br>"+

'<span class="small">'+

"El sistema necesita localizar primero "+
"los cuatro bordes antes de analizar "+
"cualquier otra característica."

+
"</span>";

}


}


/* =====================================
   ERROR
===================================== */


catch(error){


console.error(
error
);


setStatus(
"✕ Error durante la detección",
"error"
);


result.style.display =
"block";


result.innerHTML =

"Se produjo un error técnico:<br><br>"+

"<code>"+

escapeHtml(
error.message ||
String(error)
)+

"</code>";

}


/* =====================================
   LIMPIEZA
===================================== */


finally{


if(src)
src.delete();


if(gray)
gray.delete();


if(blur)
blur.delete();


if(edges)
edges.delete();


if(morph)
morph.delete();


if(contours)
contours.delete();


if(hierarchy)
hierarchy.delete();


if(best)
best.delete();

}

}



/* =====================================
   OBTENER PUNTOS
===================================== */


function getPoints(
mat
){

const points = [];


for(
let i=0;
i<mat.rows;
i++
){

points.push({

x:
mat.data32S[
i *
2
],

y:
mat.data32S[
i *
2 +
1
]

});

}


return points;

}



/* =====================================
   ORDENAR ESQUINAS
===================================== */


function orderPoints(
points
){

if(
points.length !== 4
)
return points;



const sums =
points.map(
p =>
p.x +
p.y
);


const diffs =
points.map(
p =>
p.x -
p.y
);



const tl =
points[
sums.indexOf(
Math.min(
...sums
)
)
];


const br =
points[
sums.indexOf(
Math.max(
...sums
)
)
];


const tr =
points[
diffs.indexOf(
Math.max(
...diffs
)
)
];


const bl =
points[
diffs.indexOf(
Math.min(
...diffs
)
)
];


return [
tl,
tr,
br,
bl
];

}



/* =====================================
   DISTANCIA
===================================== */


function distance(
a,
b
){

return Math.sqrt(

Math.pow(
b.x -
a.x,
2
)

+

Math.pow(
b.y -
a.y,
2
)

);

}



/* =====================================
   ESCAPAR HTML
===================================== */


function escapeHtml(
str
){

return String(
str
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}

</script>

</body>

</html>
