<style>
  :root{
    --paper:#FAFAF8;
    --paper-2:#F1EFE9;
    --ink:#17171B;
    --ink-soft:#6B6A65;
    --line:#E1DFD6;
    --red:#BC002D;
    --gold:#9C7A22;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --shadow-card:0 1px 2px rgba(23,23,27,.04), 0 6px 18px -10px rgba(23,23,27,.18);
    --shadow-pressed:0 1px 1px rgba(23,23,27,.08);
    --city:#B5651D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans', sans-serif; overscroll-behavior-y:none;}
  body{padding-bottom:calc(36px + env(safe-area-inset-bottom));}

  .serif{font-family:'Source Serif 4', Georgia, serif;}
  .mono{font-family:'JetBrains Mono', monospace;}
  .caps{ text-transform:uppercase; letter-spacing:.09em; }

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(250,250,248,.92);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:calc(12px + env(safe-area-inset-top)) 18px 0 18px;
  }
  .eyebrow{
    font-size:10.5px; color:var(--ink-soft); font-weight:600; margin-bottom:4px;
  }
  .trip-title{
    display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:14px;
  }
  .trip-title h1{
    font-size:23px; margin:0; font-weight:600; color:var(--ink); letter-spacing:-.01em;
  }
  .trip-title span{
    font-size:10.5px; color:var(--ink-soft);
    padding:3px 8px; border:1px solid var(--line); border-radius:20px;
  }

  .city-tabs{
    display:flex; gap:22px; overflow-x:auto; scrollbar-width:none;
  }
  .city-tabs::-webkit-scrollbar{display:none;}
  .city-tab{
    flex:0 0 auto; position:relative;
    display:flex; align-items:center; gap:6px;
    padding:0 0 11px 0;
    cursor:pointer;
    font-size:13.5px; font-weight:600; color:var(--ink-soft);
    border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .city-tab .dot{width:6px; height:6px; border-radius:50%; background:var(--dot-color, var(--ink-soft)); opacity:.55; transition:opacity .15s ease;}
  .city-tab.active{ color:var(--ink); border-color:var(--dot-color); }
  .city-tab.active .dot{ opacity:1; }
  .city-tab:active{ opacity:.6; }

  /* ===== Day selector ===== */
  .day-strip{
    display:flex; gap:10px; overflow-x:auto; padding:16px 18px; scrollbar-width:none;
  }
  .day-strip::-webkit-scrollbar{display:none;}

  .ticket{
    flex:0 0 auto; position:relative;
    width:92px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    padding:10px 10px 10px 13px;
    cursor:pointer; text-align:left;
    box-shadow:var(--shadow-card);
    overflow:hidden;
    transition:transform .12s ease, box-shadow .15s ease, background .15s ease;
  }
  .ticket::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--dot-color);
  }
  .ticket:active{ transform:scale(.96); box-shadow:var(--shadow-pressed); }
  .ticket .num{ font-size:23px; font-weight:600; line-height:1; font-family:'Source Serif 4', serif;}
  .ticket .wd{ font-size:9.5px; color:var(--ink-soft); margin-top:5px; font-weight:600; }
  .ticket .dt{ font-size:10.5px; color:var(--ink-soft); margin-top:1px; }
  .ticket.active{ background:var(--paper-2); border-color:var(--dot-color); }
  .ticket .today-dot{
    position:absolute; top:9px; right:9px; width:7px; height:7px; border-radius:50%; background:var(--red);
  }

  /* ===== Main content ===== */
  main{ padding:2px 18px 24px 18px; }

  .day-heading{ margin:8px 0 16px 0; }
  .day-heading h2{ font-size:19px; margin:0 0 3px 0; font-weight:600; color:var(--ink); }
  .day-heading .sub{ font-size:12px; color:var(--ink-soft); }

  #main-inner{ animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .block{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--r-md);
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:var(--shadow-card);
  }
  .block-head{
    display:flex; align-items:center; gap:8px;
    padding:11px 14px;
    border-bottom:1px solid var(--line);
  }
  .block-head .tico{ flex:0 0 auto; color:var(--dot-color); }
  .block-head .label{ font-weight:600; font-size:12.5px; letter-spacing:.04em; color:var(--ink); flex:1; }
  .block-head .time{ font-size:11.5px; color:var(--ink-soft); }
  .block-intro{ padding:9px 14px 0 14px; font-size:12.5px; color:var(--ink-soft); font-style:italic; }

  .items{ padding:2px 0 4px 0; }
  .item{
    display:flex; align-items:center; gap:10px;
    padding:11px 14px;
    text-decoration:none; color:var(--ink);
    transition:background .12s ease;
  }
  .item:active{ background:var(--paper-2); }
  .item .pin{ flex:0 0 auto; color:var(--dot-color); }
  .item .body{ flex:1; min-width:0; }
  .item .name{ font-size:14.5px; font-weight:500; line-height:1.35; display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .item .note{ display:block; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .item .chev{ flex:0 0 auto; color:var(--line); }
  .item.pending .name{ color:var(--red); font-style:italic; }
  .tag-opt{
    font-size:9.5px; font-weight:600; color:var(--ink-soft); border:1px solid var(--line);
    padding:1px 6px; border-radius:20px; letter-spacing:.04em;
  }

  /* ===== Special / festival card ===== */
  .special{
    background:#FBF7EC;
    border:1px solid #E7D9AE;
    border-radius:var(--r-md);
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:var(--shadow-card);
  }
  .special summary{
    list-style:none; cursor:pointer;
    display:flex; align-items:center; gap:10px;
    padding:12px 14px;
  }
  .special summary::-webkit-details-marker{ display:none; }
  .special .sico{ flex:0 0 auto; color:var(--gold); }
  .special .stext{ flex:1; }
  .special .stitle{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .special .ssub{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .special .schev{ flex:0 0 auto; color:var(--gold); transition:transform .2s ease; }
  .special[open] .schev{ transform:rotate(90deg); }
  .special .sbody{ padding:0 14px 16px 14px; font-size:13px; line-height:1.55; color:var(--ink); }
  .special .sbody p{ margin:0 0 10px 0; }
  .special .sbody ol{ margin:6px 0 0 0; padding-left:18px; }
  .special .sbody li{ margin-bottom:6px; }
  .special .sbody b{ display:block; margin-bottom:6px; font-weight:600;}

  .empty{ text-align:center; padding:52px 24px; color:var(--ink-soft); font-size:14px; }
  .empty b{ display:block; color:var(--ink); font-weight:600; margin-bottom:6px; font-size:15px; font-family:'Source Serif 4', serif;}

  footer{ text-align:center; padding:20px; font-size:10.5px; color:var(--ink-soft); opacity:.7; }
</style>

// ==========================================================
// LÓGICA DE RENDERIZADO
// ==========================================================
let activeCity = 'osaka';
let activeDayIndex = 0;

const cityTabsEl = document.getElementById('city-tabs');
const dayStripEl = document.getElementById('day-strip');
const mainEl = document.getElementById('main');
const rangeEl = document.getElementById('trip-range');

function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function mapsUrl(place){
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place);
}
function pinIcon(){
  return '<svg class="pin" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>';
}
function chevIcon(){
  return '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';
}
function lanternIcon(){
  return '<svg class="sico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 2h6M12 2v3M7 7h10l-1.2 11.5a2 2 0 0 1-2 1.8h-3.6a2 2 0 0 1-2-1.8L7 7z"/><path d="M9 11h6M8.5 15h7"/><path d="M12 19v3"/></svg>';
}
function timeIcon(label){
  const l = label.toLowerCase();
  if(l.includes('mañana')) return '<svg class="tico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="17" r="4"/><path d="M12 3v3M4.2 10.2l1.8 1.8M19.8 10.2 18 12M2 20h20M6 20a6 6 0 0 1 12 0"/></svg>';
  if(l.includes('mediod')) return '<svg class="tico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2 2M17.8 17.8l2 2M2 12h3M19 12h3M4.2 19.8l2-2M17.8 6.2l2-2"/></svg>';
  if(l.includes('noche')) return '<svg class="tico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  if(l.includes('tarde')) return '<svg class="tico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M4.2 4.2l1.4 1.4M2 12h2M19.8 4.2l-1.4 1.4M22 12h-2M12 20v2M2 20h20"/></svg>';
  return '<svg class="tico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>';
}
const MONTHS = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
function renderTripRange(){
  const allDates = Object.values(TRIP).flatMap(c => c.days.map(d => d.date)).sort();
  if(!allDates.length){ rangeEl.textContent = ''; return; }
  const first = allDates[0], last = allDates[allDates.length - 1];
  const [,fm,fd] = first.split('-').map(Number);
  const [ly,lm,ld] = last.split('-').map(Number);
  rangeEl.textContent = fd + ' ' + MONTHS[fm-1] + ' – ' + ld + ' ' + MONTHS[lm-1] + ' ' + ly;
}

function renderCityTabs(){
  cityTabsEl.innerHTML = '';
  Object.keys(TRIP).forEach(key => {
    const city = TRIP[key];
    const btn = document.createElement('div');
    btn.className = 'city-tab' + (key === activeCity ? ' active' : '');
    btn.style.setProperty('--dot-color', city.color);
    btn.innerHTML = '<span class="dot"></span>' + city.name;
    btn.onclick = () => { activeCity = key; activeDayIndex = 0; renderAll(); };
    cityTabsEl.appendChild(btn);
  });
}

function renderDayStrip(){
  const city = TRIP[activeCity];
  dayStripEl.innerHTML = '';
  const today = todayISO();
  if(!city.days.length){ return; }
  city.days.forEach((day, i) => {
    const t = document.createElement('div');
    const isToday = day.date === today;
    t.className = 'ticket' + (i === activeDayIndex ? ' active' : '');
    t.style.setProperty('--dot-color', city.color);
    const dd = day.date.split('-').slice(1).reverse().join('/');
    t.innerHTML =
      '<div class="num">' + (i+1) + '</div>' +
      '<div class="wd caps">' + day.weekday + '</div>' +
      '<div class="dt mono">' + dd + '</div>' +
      (isToday ? '<div class="today-dot"></div>' : '');
    t.onclick = () => { activeDayIndex = i; renderAll(); };
    dayStripEl.appendChild(t);
  });
}

function renderMain(){
  const city = TRIP[activeCity];
  mainEl.innerHTML = '';
  mainEl.style.setProperty('--dot-color', city.color);

  if(!city.days.length){
    mainEl.innerHTML = '<div class="empty"><b>Sin itinerario todavía</b>Añade los días de ' + city.name + ' en el objeto TRIP del código.</div>';
    return;
  }

  const inner = document.createElement('div');
  inner.id = 'main-inner';
  const day = city.days[activeDayIndex];

  const heading = document.createElement('div');
  heading.className = 'day-heading';
  heading.innerHTML = '<h2 class="serif">' + day.title + '</h2><span class="sub">' + day.weekday + ' · ' + day.date.split('-').slice(1).reverse().join('/') + '</span>';
  inner.appendChild(heading);

  day.blocks.forEach(block => {
    const b = document.createElement('div');
    b.className = 'block';
    b.style.setProperty('--dot-color', city.color);

    const head = document.createElement('div');
    head.className = 'block-head';
    head.innerHTML = timeIcon(block.label) + '<span class="label caps">' + block.label + '</span>' + (block.time ? '<span class="time mono">' + block.time + '</span>' : '');
    b.appendChild(head);

    if(block.intro){
      const intro = document.createElement('div');
      intro.className = 'block-intro';
      intro.textContent = block.intro;
      b.appendChild(intro);
    }

    const items = document.createElement('div');
    items.className = 'items';
    block.items.forEach(item => {
      const a = document.createElement('a');
      a.className = 'item' + (item.pending ? ' pending' : '');
      a.href = item.pending ? '#' : mapsUrl(item.place || item.name);
      a.target = item.pending ? '' : '_blank';
      const optTag = item.optional ? '<span class="tag-opt">Opcional</span>' : '';
      a.innerHTML = pinIcon() + '<div class="body"><span class="name">' + item.name + optTag + '</span>' + (item.note ? '<span class="note">' + item.note + '</span>' : '') + '</div>' + (item.pending ? '' : chevIcon());
      items.appendChild(a);
    });
    b.appendChild(items);
    inner.appendChild(b);

    if(block.special){
      const det = document.createElement('details');
      det.className = 'special';
      det.innerHTML =
        '<summary>' + lanternIcon() +
        '<div class="stext"><div class="stitle">' + block.special.title + '</div><div class="ssub">' + block.special.sub + '</div></div>' +
        chevIcon().replace('class="chev"','class="schev"') +
        '</summary>' +
        '<div class="sbody">' + block.special.body + '</div>';
      inner.appendChild(det);
    }
  });

  mainEl.appendChild(inner);
}

function renderAll(){
  renderCityTabs();
  renderDayStrip();
  renderMain();
  renderTripRange();
}

renderAll();
</script>
