name: Ampliar indice visual PCI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ref-cache
          key: pci-references-${{ github.run_id }}
          restore-keys: pci-references-

      - run: python -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'

      - name: Descargar referencias y construir indice
        run: python -u tools/build_visual_index.py --workers 12

      - uses: actions/upload-artifact@v4
        with:
          name: PCI-indice-visual-actualizado
          path: data/
          if-no-files-found: error
